id: c7-restart-recovery
name: Restart after a direct request
description: >
  A direct request is accepted, then the subject is restarted before the run
  ends. The subject should recover without sending a duplicate outbound message.
  If the adapter cannot restart, the scenario is reported as not_tested.
events:
  - id: evt-c7-001
    kind: issue_comment
    source: github
    threadKey: acme/checkout#12
    actor: alice
    text: "@superagent-bot please fix the login timeout on checkout"
    mentionsAgent: true
    timestamp: "2026-01-01T00:00:00.000Z"
policy:
  allowedActors: [alice, bob]
restart: true
timeoutMs: 20000
quietMs: 800
expect:
  outboundAtLeast: 1
  duplicateOutbound: false
requires: [event-injection, outbound-capture, restart]

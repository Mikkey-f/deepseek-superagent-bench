name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck / lint / test / fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Evaluator self-test (negative controls)
        run: npm run bench:selftest

      - name: Build
        run: npm run build

      - name: Fixture suite (offline)
        run: npm run bench:fixture -- --out results/ci-fixture

      - name: Upload fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-report
          path: results/ci-fixture
          if-no-files-found: ignore
